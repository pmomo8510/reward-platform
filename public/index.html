<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reward Platform</title>

    <meta
        name="description"
        content="Reward Platform — plateforme de récompenses permettant de regarder des publicités et de gagner des récompenses."
    >

    <style>

       
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #07111f;
    --surface: #ffffff;
    --primary: #0f9f75;
    --primary-dark: #087f5b;
    --text: #142238;
    --muted: #718096;
    --border: #e2e8f0;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: Inter, Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at top, #173b4b 0%, transparent 55%),
        linear-gradient(145deg, #07111f, #102238 65%, #0b1728);
}

.container {
    width: 100%;
    max-width: 440px;
}

.logo {
    text-align: center;
    color: white;
    margin-bottom: 26px;
}

.logo h1 {
    font-size: clamp(27px, 6vw, 34px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 9px;
}

.logo h1::before {
    content: "✦";
    display: inline-block;
    margin-right: 9px;
    color: #34d399;
}

.logo p {
    color: #b8c8d9;
    font-size: 14px;
    line-height: 1.6;
}

.card {
    width: 100%;
    background: var(--surface);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 24px;
    padding: clamp(22px, 6vw, 32px);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
}

.tabs {
    display: flex;
    gap: 6px;
    padding: 5px;
    margin-bottom: 28px;
    border-radius: 13px;
    background: #f1f5f9;
}

.tab {
    flex: 1;
    min-width: 0;
    padding: 12px 8px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #64748b;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
}

.tab.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(15, 159, 117, 0.22);
}

.form {
    display: none;
}

.form.active {
    display: block;
    animation: appear 0.25s ease;
}

.form h2 {
    font-size: clamp(22px, 5vw, 26px);
    letter-spacing: -0.6px;
    margin-bottom: 9px;
}

.form-description {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.field {
    margin-bottom: 19px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
}

input {
    display: block;
    width: 100%;
    min-height: 49px;
    padding: 13px 14px;
    border: 1px solid #d5deea;
    border-radius: 12px;
    background: #fbfdff;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

input::placeholder {
    color: #9aa8ba;
}

input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px rgba(15, 159, 117, 0.12);
}

.button {
    width: 100%;
    min-height: 50px;
    margin-top: 5px;
    padding: 14px 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #10a778, #087f5b);
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(15, 159, 117, 0.2);
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}

.button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(15, 159, 117, 0.28);
}

.button:active:not(:disabled) {
    transform: translateY(0);
}

.button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 13px 14px;
    margin-bottom: 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.message.show {
    display: block;
}

.message.error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

.message.success {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
}

.password-info {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

.footer {
    width: 100%;
    text-align: center;
    color: #8fa3b8;
    font-size: 12px;
    line-height: 1.6;
}

button:focus-visible,
input:focus-visible {
    outline: 3px solid rgba(52, 211, 153, 0.45);
    outline-offset: 3px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    body {
        padding: 24px 14px;
        gap: 16px;
    }

    .logo {
        margin-bottom: 20px;
    }

    .card {
        border-radius: 20px;
    }

    .tabs {
        margin-bottom: 24px;
    }

    .tab {
        font-size: 13px;
        padding: 12px 5px;
    }

    input,
    .button {
        min-height: 48px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}


    </style>

</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <h1>
            Reward Platform
        </h1>

        <p>
            Votre espace de récompenses
        </p>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                type="button"
                onclick="showForm('login')"
            >
                Connexion
            </button>

            <button
                class="tab"
                id="registerTab"
                type="button"
                onclick="showForm('register')"
            >
                Créer un compte
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =========================
             LOGIN
        ========================== -->

        <form
            id="loginForm"
            class="form active"
            onsubmit="login(event)"
        >

            <h2>
                Bon retour 👋
            </h2>

            <p class="form-description">
                Connectez-vous à votre compte
                pour accéder à votre tableau de bord.
            </p>


            <div class="field">

                <label for="loginEmail">
                    Adresse e-mail
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <div class="field">

                <label for="loginPassword">
                    Mot de passe
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="button"
                type="submit"
            >
                Se connecter
            </button>

        </form>


        <!-- =========================
             REGISTER
        ========================== -->

        <form
            id="registerForm"
            class="form"
            onsubmit="register(event)"
        >

            <h2>
                Créer un compte 🚀
            </h2>

            <p class="form-description">
                Créez votre compte pour accéder
                à votre espace personnel.
            </p>


            <div class="field">

                <label for="registerName">
                    Nom
                </label>

                <input
                    id="registerName"
                    type="text"
                    autocomplete="name"
                    placeholder="Votre nom"
                    minlength="2"
                    maxlength="100"
                    required
                >

            </div>


            <div class="field">

                <label for="registerEmail">
                    Adresse e-mail
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="exemple@email.com"
                    maxlength="254"
                    required
                >

            </div>


            <div class="field">

                <label for="registerPassword">
                    Mot de passe
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >

                <div class="password-info">
                    Utilisez au moins 8 caractères.
                </div>

            </div>


            <button
                id="registerButton"
                class="button"
                type="submit"
            >
                Créer mon compte
            </button>

        </form>


    </div>

    </div>


    <div class="footer">

        Reward Platform ©
        <span id="year"></span>

    </div>

</div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const message =
        document.getElementById("message");


    /* =====================================================
       YEAR
    ===================================================== */

    document.getElementById("year").textContent =
        new Date().getFullYear();


    /* =====================================================
       SHOW FORM
    ===================================================== */

    function showForm(form) {

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const loginTab =
            document.getElementById(
                "loginTab"
            );

        const registerTab =
            document.getElementById(
                "registerTab"
            );


        hideMessage();


        if (form === "register") {

            loginForm.classList.remove(
                "active"
            );

            registerForm.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerTab.classList.add(
                "active"
            );

        } else {

            registerForm.classList.remove(
                "active"
            );

            loginForm.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

            loginTab.classList.add(
                "active"
            );
        }
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent =
            text;

        message.className =
            "message show " +
            type;
    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login(event) {

        event.preventDefault();

        hideMessage();


        const email =
            document
                .getElementById(
                    "loginEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        const button =
            document.getElementById(
                "loginButton"
            );


        if (!email || !password) {

            showMessage(
                "Veuillez remplir tous les champs."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Connexion...";


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible de se connecter."
                );
            }


            showMessage(
                "Connexion réussie. Redirection...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "/dashboard.html";

            }, 500);


        } catch (error) {

            console.error(
                "LOGIN:",
                error
            );

            showMessage(
                error.message ||
                "Erreur de connexion."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Se connecter";
        }
    }


    /* =====================================================
       REGISTER
    ===================================================== */

    async function register(event) {

        event.preventDefault();

        hideMessage();


        const name =
            document
                .getElementById(
                    "registerName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "registerEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;


        const button =
            document.getElementById(
                "registerButton"
            );


        if (name.length < 2) {

            showMessage(
                "Le nom doit contenir au moins 2 caractères."
            );

            return;
        }


        if (!email.includes("@")) {

            showMessage(
                "Veuillez entrer une adresse e-mail valide."
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Le mot de passe doit contenir au moins 8 caractères."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Création...";


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible de créer le compte."
                );
            }


            showMessage(
                "Compte créé avec succès. Redirection...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "/dashboard.html";

            }, 500);


        } catch (error) {

            console.error(
                "REGISTER:",
                error
            );

            showMessage(
                error.message ||
                "Erreur lors de la création du compte."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Créer mon compte";
        }
    }


    /* =====================================================
       CHECK SESSION
    ===================================================== */

    async function checkSession() {

        try {

            const response =
                await fetch(
                    "/api/me",
                    {
                        credentials:
                            "same-origin"
                    }
                );


            if (response.ok) {

                window.location.href =
                    "/dashboard.html";
            }

        } catch (error) {

            console.log(
                "Aucune session active."
            );
        }
    }


    checkSession();

</script>

</body>

</html>
