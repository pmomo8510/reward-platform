<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reward Platform</title>

    <meta
        name="description"
        content="Reward Platform — plateforme de récompenses permettant de regarder des publicités et de gagner des récompenses."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;

            border: none;
            background: #f1f5f9;

            padding: 13px;

            border-radius: 10px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .form-description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;

            font-size: 14px;
            font-weight: bold;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        .button {
            width: 100%;

            border: none;

            background: #2563eb;
            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 5px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 16px;

            font-size: 14px;

            line-height: 1.4;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .demo {
            margin-top: 22px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 12px;

            padding: 14px;

            font-size: 12px;

            color: #64748b;

            line-height: 1.5;

            text-align: center;
        }

        .footer {
            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            margin-top: 18px;
        }

        .password-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 22px;
            }

            .logo h1 {
                font-size: 27px;
            }
        }

    </style>

</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <h1>
            Reward Platform
        </h1>

        <p>
            Votre espace de récompenses
        </p>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                type="button"
                onclick="showForm('login')"
            >
                Connexion
            </button>

            <button
                class="tab"
                id="registerTab"
                type="button"
                onclick="showForm('register')"
            >
                Créer un compte
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =========================
             LOGIN
        ========================== -->

        <form
            id="loginForm"
            class="form active"
            onsubmit="login(event)"
        >

            <h2>
                Bon retour 👋
            </h2>

            <p class="form-description">
                Connectez-vous à votre compte
                pour accéder à votre tableau de bord.
            </p>


            <div class="field">

                <label for="loginEmail">
                    Adresse e-mail
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <div class="field">

                <label for="loginPassword">
                    Mot de passe
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="button"
                type="submit"
            >
                Se connecter
            </button>

        </form>


        <!-- =========================
             REGISTER
        ========================== -->

        <form
            id="registerForm"
            class="form"
            onsubmit="register(event)"
        >

            <h2>
                Créer un compte 🚀
            </h2>

            <p class="form-description">
                Créez votre compte pour accéder
                à votre espace personnel.
            </p>


            <div class="field">

                <label for="registerName">
                    Nom
                </label>

                <input
                    id="registerName"
                    type="text"
                    autocomplete="name"
                    placeholder="Votre nom"
                    minlength="2"
                    maxlength="100"
                    required
                >

            </div>


            <div class="field">

                <label for="registerEmail">
                    Adresse e-mail
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    autocomplete="email"
                    placeholder="exemple@email.com"
                    maxlength="254"
                    required
                >

            </div>


            <div class="field">

                <label for="registerPassword">
                    Mot de passe
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >

                <div class="password-info">
                    Utilisez au moins 8 caractères.
                </div>

            </div>


            <button
                id="registerButton"
                class="button"
                type="submit"
            >
                Créer mon compte
            </button>

        </form>


    </div>

    </div>


    <div class="footer">

        Reward Platform ©
        <span id="year"></span>

    </div>

</div>


<script>

    /* =====================================================
       ELEMENTS
    ===================================================== */

    const message =
        document.getElementById("message");


    /* =====================================================
       YEAR
    ===================================================== */

    document.getElementById("year").textContent =
        new Date().getFullYear();


    /* =====================================================
       SHOW FORM
    ===================================================== */

    function showForm(form) {

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const loginTab =
            document.getElementById(
                "loginTab"
            );

        const registerTab =
            document.getElementById(
                "registerTab"
            );


        hideMessage();


        if (form === "register") {

            loginForm.classList.remove(
                "active"
            );

            registerForm.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerTab.classList.add(
                "active"
            );

        } else {

            registerForm.classList.remove(
                "active"
            );

            loginForm.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

            loginTab.classList.add(
                "active"
            );
        }
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent =
            text;

        message.className =
            "message show " +
            type;
    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login(event) {

        event.preventDefault();

        hideMessage();


        const email =
            document
                .getElementById(
                    "loginEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        const button =
            document.getElementById(
                "loginButton"
            );


        if (!email || !password) {

            showMessage(
                "Veuillez remplir tous les champs."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Connexion...";


        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible de se connecter."
                );
            }


            showMessage(
                "Connexion réussie. Redirection...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "/dashboard.html";

            }, 500);


        } catch (error) {

            console.error(
                "LOGIN:",
                error
            );

            showMessage(
                error.message ||
                "Erreur de connexion."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Se connecter";
        }
    }


    /* =====================================================
       REGISTER
    ===================================================== */

    async function register(event) {

        event.preventDefault();

        hideMessage();


        const name =
            document
                .getElementById(
                    "registerName"
                )
                .value
                .trim();


        const email =
            document
                .getElementById(
                    "registerEmail"
                )
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;


        const button =
            document.getElementById(
                "registerButton"
            );


        if (name.length < 2) {

            showMessage(
                "Le nom doit contenir au moins 2 caractères."
            );

            return;
        }


        if (!email.includes("@")) {

            showMessage(
                "Veuillez entrer une adresse e-mail valide."
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Le mot de passe doit contenir au moins 8 caractères."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Création...";


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name,
                                email,
                                password
                            })
                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Impossible de créer le compte."
                );
            }


            showMessage(
                "Compte créé avec succès. Redirection...",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "/dashboard.html";

            }, 500);


        } catch (error) {

            console.error(
                "REGISTER:",
                error
            );

            showMessage(
                error.message ||
                "Erreur lors de la création du compte."
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Créer mon compte";
        }
    }


    /* =====================================================
       CHECK SESSION
    ===================================================== */

    async function checkSession() {

        try {

            const response =
                await fetch(
                    "/api/me",
                    {
                        credentials:
                            "same-origin"
                    }
                );


            if (response.ok) {

                window.location.href =
                    "/dashboard.html";
            }

        } catch (error) {

            console.log(
                "Aucune session active."
            );
        }
    }


    checkSession();

</script>

</body>

</html>
